[workspace]
resolver = "3"
members = [
    "crates/moca-protocol",
    "crates/moca-maa",
    "crates/moca-runtime",
    "crates/moca-cloud",
    "crates/moca-ui",
]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "Apache-2.0"
authors = ["Moca Contributors"]

[workspace.dependencies]
moca-protocol = { path = "crates/moca-protocol" }
moca-maa = { path = "crates/moca-maa" }
moca-runtime = { path = "crates/moca-runtime" }
moca-cloud = { path = "crates/moca-cloud" }

maa-framework = { version = "1.29.1", features = ["dynamic", "image"] }
eframe = "0.37.0"
egui = "0.37.0"
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }
